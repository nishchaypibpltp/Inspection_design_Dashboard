<style>body{margin:0}iframe{border:0;width:100vw;height:100vh}</style>
<script>localStorage.setItem('theme', new URLSearchParams(location.search).get('t'));</script>
<iframe id="f" src="/#overview"></iframe>
<script>
const z = Number(new URLSearchParams(location.search).get('z') || 0), f = document.getElementById('f');
f.onload = () => setTimeout(() => {
  const d = f.contentDocument;
  for (let i = 0; i < z; i++) d.querySelector('.chart-zoom [data-z="1"]').click();
  d.querySelector('.chart-zoom').closest('.card').scrollIntoView();
}, 1500);
</script>
